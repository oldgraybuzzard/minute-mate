<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinuteMate - Login</title>
    <link rel="preload" href="images/logo.png" as="image">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <!-- Header -->
        <header class="auth-header">
            <div class="logo">
                <img src="images/logo.png" alt="MinuteMate Logo" class="logo-image">
                <h1>MinuteMate</h1>
            </div>
            <div class="header-controls">
                <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Auth Forms Container -->
        <div class="auth-forms">
            <!-- Login Form -->
            <div class="auth-form active" id="login-form">
                <div class="form-header">
                    <h2><i class="fas fa-sign-in-alt"></i> Welcome Back</h2>
                    <p>Sign in to your MinuteMate account</p>
                </div>

                <form id="login-form-element">
                    <div class="form-group">
                        <label for="login-identifier">Email or Username</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="login-identifier" name="login" required 
                                   placeholder="Enter your email or username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" name="password" required 
                                   placeholder="Enter your password">
                            <button type="button" class="password-toggle" data-target="login-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me" name="remember">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-btn primary">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? 
                        <a href="#" class="switch-form" data-target="register-form">Sign up here</a>
                    </p>
                </div>
            </div>

            <!-- Register Form -->
            <div class="auth-form" id="register-form">
                <div class="form-header">
                    <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                    <p>Join MinuteMate to manage your meetings</p>
                </div>

                <form id="register-form-element">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="first-name" name="first_name" required 
                                       placeholder="First name">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="last-name" name="last_name" required 
                                       placeholder="Last name">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="register-email" name="email" required 
                                   placeholder="Enter your email address">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <div class="input-group">
                            <i class="fas fa-at"></i>
                            <input type="text" id="register-username" name="username" required 
                                   placeholder="Choose a username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="register-password" name="password" required 
                                   placeholder="Create a strong password">
                            <button type="button" class="password-toggle" data-target="register-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill"></div>
                            </div>
                            <span class="strength-text">Password strength</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirm-password" name="confirm_password" required 
                                   placeholder="Confirm your password">
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms-agreement" name="terms" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#" class="terms-link">Terms of Service</a> and 
                            <a href="#" class="privacy-link">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="auth-btn primary">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <div class="form-footer">
                    <p>Already have an account? 
                        <a href="#" class="switch-form" data-target="login-form">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Processing...</p>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast">
            <div class="toast-icon">
                <i class="fas fa-info-circle"></i>
            </div>
            <div class="toast-message">Message</div>
            <button class="toast-close">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
