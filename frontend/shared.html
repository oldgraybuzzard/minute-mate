<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Meeting - MinuteMate</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .shared-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 30px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .shared-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .meeting-content {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .meeting-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--gray-50);
            border-radius: var(--border-radius);
        }
        
        .meta-item {
            text-align: center;
        }
        
        .meta-label {
            font-size: 0.9rem;
            color: var(--gray-600);
            margin-bottom: 5px;
        }
        
        .meta-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gray-800);
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h3 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .attendees-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .attendee {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .action-item, .decision-item {
            background: var(--gray-50);
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
        }
        
        .transcript-section {
            background: var(--gray-50);
            border-radius: var(--border-radius);
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .powered-by {
            text-align: center;
            padding: 20px;
            color: var(--gray-600);
            font-size: 0.9rem;
        }
        
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid var(--gray-200);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="shared-header">
        <div class="shared-container">
            <h1><i class="fas fa-share-alt"></i> Shared Meeting Minutes</h1>
            <p>Powered by MinuteMate</p>
        </div>
    </div>

    <div class="shared-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading meeting details...</p>
        </div>

        <div id="error" class="error-message" style="display: none;">
            <h3>Meeting Not Found</h3>
            <p>This shared link may have expired or been revoked.</p>
        </div>

        <div id="meeting-content" style="display: none;">
            <!-- Meeting content will be loaded here -->
        </div>
    </div>

    <div class="powered-by">
        <p>Generated by <strong>MinuteMate</strong> - AI-Powered Meeting Minutes</p>
    </div>

    <script>
        class SharedMeetingViewer {
            constructor() {
                this.apiBaseUrl = window.location.origin;
                this.token = window.location.pathname.split('/').pop();
                this.loadMeeting();
            }

            async loadMeeting() {
                try {
                    // For now, we'll simulate loading a meeting
                    // In a real implementation, you'd call an API endpoint
                    setTimeout(() => {
                        this.showError();
                    }, 2000);
                    
                } catch (error) {
                    console.error('Error loading shared meeting:', error);
                    this.showError();
                }
            }

            showError() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }

            displayMeeting(meeting) {
                const content = document.getElementById('meeting-content');
                const loading = document.getElementById('loading');
                
                content.innerHTML = `
                    <div class="meeting-content">
                        <h2>${meeting.title}</h2>
                        
                        <div class="meeting-meta">
                            <div class="meta-item">
                                <div class="meta-label">Date</div>
                                <div class="meta-value">${new Date(meeting.meeting_date).toLocaleDateString()}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Duration</div>
                                <div class="meta-value">${meeting.duration_minutes} minutes</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Attendees</div>
                                <div class="meta-value">${meeting.attendees ? meeting.attendees.length : 0}</div>
                            </div>
                        </div>

                        ${meeting.attendees && meeting.attendees.length > 0 ? `
                            <div class="section">
                                <h3><i class="fas fa-users"></i> Attendees</h3>
                                <div class="attendees-list">
                                    ${meeting.attendees.map(attendee => `<span class="attendee">${attendee}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}

                        ${meeting.agenda_items && meeting.agenda_items.length > 0 ? `
                            <div class="section">
                                <h3><i class="fas fa-list"></i> Agenda Items</h3>
                                <ul>
                                    ${meeting.agenda_items.map(item => `<li>${item}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}

                        ${meeting.key_decisions && meeting.key_decisions.length > 0 ? `
                            <div class="section">
                                <h3><i class="fas fa-gavel"></i> Key Decisions</h3>
                                ${meeting.key_decisions.map(decision => `<div class="decision-item">${decision}</div>`).join('')}
                            </div>
                        ` : ''}

                        ${meeting.action_items && meeting.action_items.length > 0 ? `
                            <div class="section">
                                <h3><i class="fas fa-tasks"></i> Action Items</h3>
                                ${meeting.action_items.map(item => `<div class="action-item">${item}</div>`).join('')}
                            </div>
                        ` : ''}

                        ${meeting.transcript ? `
                            <div class="section">
                                <h3><i class="fas fa-file-text"></i> Transcript</h3>
                                <div class="transcript-section">
                                    <pre>${meeting.transcript}</pre>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                loading.style.display = 'none';
                content.style.display = 'block';
            }
        }

        // Initialize the shared meeting viewer
        document.addEventListener('DOMContentLoaded', () => {
            new SharedMeetingViewer();
        });
    </script>
</body>
</html>
